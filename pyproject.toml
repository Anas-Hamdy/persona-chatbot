[project]
name = "persona-chatbot-worker"
version = "0.1.0"
requires-python = ">=3.12"
# Cloudflare Python Workers run on Pyodide, which only supports pure-Python
# and PyEmscripten-wheel packages (see docs/CLOUDFLARE_DEPLOYMENT.md). This
# list is deliberately smaller than local/requirements.txt: no nltk (its
# vader_lexicon download needs a writable persistent disk, which Workers
# doesn't have - profiler.py's built-in lexicon fallback is used instead),
# no scikit-learn/numpy (only used by evaluate.py, which never runs on
# Workers), and no gunicorn (Workers is not a WSGI-server-managed process).
#
# This file MUST be the only Python dependency manifest visible at the repo
# root - local/requirements.txt (the gunicorn/local-dev deployment's deps,
# including scikit-learn/nltk/gunicorn) is kept in a subfolder on purpose.
# An earlier layout had requirements.txt at the repo root alongside this
# file, and Cloudflare Workers Builds' own build step picked up and ran
# `pip install -r requirements.txt` instead of using this file - which tried
# to build scikit-learn from source in the Pyodide build environment and
# hung for 10+ minutes before failing. Confirmed via Cloudflare's own
# python-workers-examples repo (github.com/cloudflare/python-workers-examples,
# e.g. the flask-todo example): every example keeps only pyproject.toml at
# the Worker's root, never a sibling requirements.txt.
dependencies = [
    "flask==3.0.3",
    "asgiref==3.8.1",
    # Optional LLM backend (see chatbot_engine.py's _OpenAIGenerator) - only
    # used when ALLOW_LLM_ON_WORKERS=1 (wrangler.jsonc vars) and the
    # OPENAI_API_KEY secret are both set; the app runs the offline template
    # generator otherwise. The openai SDK calls out via httpx.Client
    # (synchronous). Cloudflare's own python-workers-examples repo has a
    # dedicated "sync-http-clients" example confirming requests/urllib3/
    # httpx.Client all work directly on Python Workers, which is why this
    # is listed as a plain dependency here rather than needing a custom
    # async fetch bridge - verify this actually resolves against Pyodide's
    # package index on the next `uv sync`/`pywrangler deploy` before
    # trusting it in production, since pydantic-core (an openai dependency)
    # ships as a compiled wheel and its Pyodide/emscripten build has not
    # been separately confirmed here yet.
    #
    # Pinned to >=1.55 (not the originally-tried 1.51.0): confirmed via a
    # real client-construction test that openai==1.51.0 crashes with
    # `TypeError: Client.__init__() got an unexpected keyword argument
    # 'proxies'` against httpx>=0.28 (openai 1.51.0 still passes a
    # `proxies=` kwarg to httpx.Client that 0.28 removed) - this is a real,
    # reproducible incompatibility, not a Workers-specific issue, and would
    # have broken the local/gunicorn deployment too (local/requirements.txt
    # updated to match). 1.59.9 was verified locally to construct an
    # OpenAI(api_key=...) client successfully with httpx 0.28.1 installed.
    "openai==1.59.9",
]

[dependency-groups]
# Matches Cloudflare's own documented pyproject.toml for Flask on Python
# Workers (developers.cloudflare.com/workers/languages/python/packages/flask/):
# both workers-py (provides the `pywrangler` CLI) and workers-runtime-sdk
# (the package actually providing `from workers import ...` at dev/build
# time) belong in the dev group, not [project].dependencies - an earlier
# attempt to "fix" a ModuleNotFoundError by moving workers-py into
# [project].dependencies was based on a wrong guess, not this doc.
dev = [
    "workers-py>=1.9",
    "workers-runtime-sdk>=1.8.2",
]

# Revision note: this file used to also have a [build-system] table and a
# [tool.setuptools] section declaring py-modules=["app","chatbot_engine",
# "profiler"] and packages=["cf"], added to fix a real
# "ModuleNotFoundError: No module named 'cf'" at deploy time. That was the
# wrong fix and became actively harmful once the real fix (moving app.py/
# chatbot_engine.py/profiler.py/cf/ into src/, alongside worker.py - see
# src/worker.py's comment) landed: those paths no longer existed at the
# repo root, so `uv run pywrangler deploy` started failing outright with
# "file app.py (for module app) not found ... error: package directory
# 'cf' does not exist" - `uv run` builds the project as an editable install
# by default when a [build-system] table is present, and that stale config
# broke the build. Cloudflare's own documented pyproject.toml for Flask on
# Python Workers (developers.cloudflare.com/workers/languages/python/
# packages/flask/) has neither section at all - Python Workers bundles
# source from the `main` entrypoint's directory (see wrangler.jsonc),
# it does not need this project installed as a package. Removed both
# sections to match that example exactly.
